<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Proxy</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proxy">

<style>
  body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#111;color:#eee}
  form{display:flex;gap:8px;width:min(560px,92vw)}
  input{flex:1;padding:12px;border-radius:8px;border:1px solid #444;background:#1c1c1c;color:#eee}
  button{padding:12px 20px;border:0;border-radius:8px;background:#4f8cff;color:#fff;cursor:pointer}
</style>
</head>
<body>
<form id="f">
  <input id="u" placeholder="検索 または URL を入力" autofocus>
  <button>検索 / 開く</button>
</form>
<script>
  // GitHub Pages に置く場合は Vercel の URL を指定 (例: "https://my-proxy.vercel.app")
  // Vercel 上で使う場合は空文字のままでOK
  const API_BASE = "";
  // 検索エンジン (%s が検索語に置き換わります)
  const SEARCH_URL = "https://search.brave.com/search?q=%s&source=web";

  function toTarget(v) {
    if (/^https?:\/\//i.test(v)) return v;                                   // URL
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?([\/?#]\S*)?$/i.test(v)) return "https://" + v; // example.com 形式
    return SEARCH_URL.replace("%s", encodeURIComponent(v));                     // それ以外は検索
  }

  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("u").value.trim();
    if (!v) return;
    location.href = API_BASE + "/api/proxy?url=" + encodeURIComponent(toTarget(v));
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
</body>
</html>
